spring:
  datasource:
    url: jdbc:h2:mem:importer-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost/test/jwks

logging:
  config: classpath:logback-test.xml

app:
  security:
    expected-issuer: http://localhost/test
  cors:
    allowed-origins: http://localhost
  kafka:
    topic: test-topic
